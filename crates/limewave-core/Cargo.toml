[package]
name = "limewave-core"
description = "Core library for Limewave: WAV/RIFF handling and loop analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
realfft = "3"
tempfile = "3"
thiserror = "2"

[features]
# Exposes the synthetic test WAV builders to other crates' tests.
testwav = []

[[example]]
name = "check_pack"
required-features = ["testwav"]

[[test]]
name = "flow"
required-features = ["testwav"]
